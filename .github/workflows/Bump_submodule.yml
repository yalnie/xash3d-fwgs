name: bump all submodule to latest commit # updating means improvement some of stuff from their code

on:
   workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: true
      - uses: sgoudham/update-git-submodules@main
      - uses: stefanzweifel/git-auto-commit-action@master
        with:
          commit_message: Bump all Submodule to latest commit
          
